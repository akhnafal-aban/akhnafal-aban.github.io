        - 'heading "Api.swift: Networking Layer Built from Scratch" [level=2] [ref=e184]'
        - paragraph [ref=e185]: Lapisan networking yang dibangun menggunakan URLSession dari Foundation, tanpa bergantung pada third-party networking libraries.
      - generic [ref=e188]:
        - generic [ref=e189]:
          - paragraph [ref=e190]: Core/Network/Api.swift · baris 75 sampai 81
          - code [ref=e192]: "enum HTTPMethod: String { case get = \"GET\" case post = \"POST\" case put = \"PUT\" case patch = \"PATCH\" case delete = \"DELETE\" }"
        - generic [ref=e193]:
          - paragraph [ref=e194]: Blok 1 dari 4
          - heading "HTTP Method dengan Type Safety" [level=3] [ref=e195]
          - paragraph [ref=e196]: HTTP method didefinisikan menggunakan enum agar pemanggil hanya dapat memilih lima case yang tersedia. Pendekatan ini mengurangi risiko typo dari penggunaan string bebas dan memanfaatkan autocomplete di Xcode. Saya suka style pendefinisian ini karena lebih rapi.
      - generic [ref=e199]:
        - generic [ref=e200]:
          - paragraph [ref=e201]: Core/Network/Api.swift · baris 11 sampai 23
          - code [ref=e203]: "static func request( endpoint: String, method: HTTPMethod, body: Data? = nil ) async throws -> Data var request = URLRequest(url: URL(string: \"\\(AppConfig.baseURL)\\(endpoint)\")!) request.httpMethod = method.rawValue request.setValue(\"application/json\", forHTTPHeaderField: \"Content-Type\") request.httpBody = body let (data, _) = try await URLSession.shared.data(for: request) return data"
        - generic [ref=e204]:
          - paragraph [ref=e205]: Blok 2 dari 4
          - heading "Centralized Request Handling" [level=3] [ref=e206]
          - paragraph [ref=e207]: Semua HTTP request diproses melalui satu fungsi. Base URL, HTTP method, header Content-Type, dan request body dikelola di satu tempat agar implementasinya konsisten. URLSession menggunakan async/await untuk menangani operasi jaringan, sementara throws meneruskan error ke pemanggil. Lewat bagian ini, saya mulai memahami sisi lain dari komunikasi API, yaitu bagaimana aplikasi di frontend mengirim request dan menangani respons dari server.
      - generic [ref=e210]:
        - generic [ref=e211]:
          - paragraph [ref=e212]: Core/Network/Api.swift · baris 25 sampai 40
          - code [ref=e214]: "static func send<T: Decodable>( endpoint: String, method: HTTPMethod = .get, type: T.Type ) async throws -> T { let data = try await request(endpoint: endpoint, method: method) let decoder = JSONDecoder() decoder.keyDecodingStrategy = .convertFromSnakeCase decoder.dateDecodingStrategy = .iso8601 return try decoder.decode(T.self, from: data) }"
        - generic [ref=e215]:
          - paragraph [ref=e216]: Blok 3 dari 4
          - heading "JSON Decoding & Data Mapping" [level=3] [ref=e217]
          - paragraph [ref=e218]: Respons JSON di-decode menjadi tipe Swift yang memenuhi Decodable. Strategi convertFromSnakeCase mengonversi key seperti current_value menjadi currentValue, sedangkan strategi iso8601 menangani decoding tanggal. Dengan begitu, field umum tidak perlu dipetakan satu per satu melalui CodingKeys.
      - generic [ref=e221]:
        - generic [ref=e222]:
          - paragraph [ref=e223]: Core/Network/Api.swift · baris 42 sampai 72
          - code [ref=e225]: "static func send<T: Decodable, U: Encodable>( endpoint: String, method: HTTPMethod = .get, body: U? = nil, type: T.Type ) async throws -> T { let encodedBody: Data? if let body { let encoder = JSONEncoder() encoder.keyEncodingStrategy = .convertToSnakeCase encoder.dateEncodingStrategy = .iso8601 encodedBody = try encoder.encode(body) } else { encodedBody = nil } let data = try await request( endpoint: endpoint, method: method, body: encodedBody ) return try JSONDecoder().decode(T.self, from: data) }"
        - generic [ref=e226]:
          - paragraph [ref=e227]: Blok 4 dari 4
          - heading "JSON Encoding & Request Serialization" [level=3] [ref=e228]
          - paragraph [ref=e229]: Bedanya dengan fungsi send sebelumnya, versi ini juga menangani proses encoding data sebelum dikirim ke server. JSONEncoder mengubah nama properti camelCase menjadi snake_case dan mengonversi tanggal ke format ISO 8601 agar format request body sesuai dengan konvensi yang digunakan backend.
